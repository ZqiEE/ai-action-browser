openapi: 3.1.0
info:
  title: AI Action Browser Outcome API
  version: 0.2.0
  description: |
    Production contract for the first free AI browser task category.
    Consumer endpoints never accept commission, bid, partner-tier, or expected-revenue inputs.
    Provider payment cannot purchase independent ranking. Each Provider receives isolated Offer API
    and outcome-signing credentials derived from platform master secrets; platform master secrets
    are never shared with Providers.
servers:
  - url: https://api.example.invalid
    description: Replace with the deployed Worker origin.
tags:
  - name: Runtime
  - name: Consumer
  - name: Provider administration
  - name: Provider feed
  - name: Provider outcomes
paths:
  /health:
    get:
      tags: [Runtime]
      operationId: getHealth
      responses:
        "200":
          description: Runtime and integration configuration status.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  searchConfigured:
                    type: boolean
                  providerAdminConfigured:
                    type: boolean
                  providerWebhookConfigured:
                    type: boolean
                  providerCredentialIsolationConfigured:
                    type: boolean
                  constraintModelConfigured:
                    type: boolean
  /v1/search:
    post:
      tags: [Consumer]
      operationId: searchWeb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 500
                count:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 8
      responses:
        "200":
          description: Live public Web results.
          content:
            application/json:
              schema:
                type: object
                required: [query, results, source, durationMs]
                properties:
                  query:
                    type: string
                  source:
                    const: brave_web_search
                  durationMs:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResult"
        "503":
          $ref: "#/components/responses/Error"
  /v1/compare:
    post:
      tags: [Consumer]
      operationId: compareOffers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 1000
                category:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9._-]*$"
                  default: laptop
      responses:
        "200":
          description: Independent provider comparison.
          content:
            application/json:
              schema:
                type: object
                required:
                  - taskId
                  - query
                  - category
                  - constraints
                  - recommendations
                  - incomplete
                  - recommendationPolicy
                properties:
                  taskId:
                    type: string
                  query:
                    type: string
                  category:
                    type: string
                  constraints:
                    $ref: "#/components/schemas/Constraints"
                  recommendations:
                    type: array
                    maxItems: 3
                    items:
                      $ref: "#/components/schemas/OfferView"
                  incomplete:
                    type: boolean
                  message:
                    type: string
                  recommendationPolicy:
                    $ref: "#/components/schemas/RecommendationPolicy"
  /v1/prepare:
    post:
      tags: [Consumer]
      operationId: prepareOutcome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [offerId]
              properties:
                offerId:
                  type: string
                taskId:
                  type: string
                query:
                  type: string
                  maxLength: 1000
      responses:
        "201":
          description: Prepared provider handoff. No external action has been authorized yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparedOutcome"
        "404":
          $ref: "#/components/responses/Error"
  /v1/outcomes/{outcomeId}/confirm:
    post:
      tags: [Consumer]
      operationId: confirmOutcome
      parameters:
        - $ref: "#/components/parameters/OutcomeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmed]
              properties:
                confirmed:
                  const: true
      responses:
        "200":
          description: Consumer-authorized handoff.
          content:
            application/json:
              schema:
                type: object
                required: [outcome, continueUrl]
                properties:
                  outcome:
                    $ref: "#/components/schemas/Outcome"
                  continueUrl:
                    type: string
                    format: uri
        "409":
          $ref: "#/components/responses/Error"
  /v1/outcomes/{outcomeId}:
    get:
      tags: [Consumer]
      operationId: getOutcome
      parameters:
        - $ref: "#/components/parameters/OutcomeId"
      responses:
        "200":
          description: Outcome receipt and authenticated Provider events.
          content:
            application/json:
              schema:
                type: object
                required: [outcome, events]
                properties:
                  outcome:
                    $ref: "#/components/schemas/Outcome"
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/OutcomeEvent"
        "404":
          $ref: "#/components/responses/Error"
  /v1/providers:
    post:
      tags: [Provider administration]
      operationId: upsertProvider
      security:
        - ProviderAdminBearer: []
      description: |
        Creates or updates a Provider and returns its current isolated credentials. This endpoint is
        platform-administrator only. Treat returned credentials as secrets and deliver them through
        an authenticated onboarding channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "201":
          description: Provider created or updated and current credentials issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProvisioning"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/providers/{providerId}/credentials/rotate:
    post:
      tags: [Provider administration]
      operationId: rotateProviderCredentials
      security:
        - ProviderAdminBearer: []
      description: |
        Increments only this Provider's credential version and returns replacement credentials.
        Previous Provider API and webhook credentials become invalid immediately.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "200":
          description: Provider credentials rotated.
          content:
            application/json:
              schema:
                type: object
                required: [providerId, credentials]
                properties:
                  providerId:
                    type: string
                  credentials:
                    $ref: "#/components/schemas/ProviderCredentials"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/providers/{providerId}/offers:
    post:
      tags: [Provider feed]
      operationId: upsertProviderOffers
      security:
        - ProviderBearer: []
        - ProviderAdminBearer: []
      description: |
        Imports Offers only for the Provider named in the path. A Provider Bearer token is scoped to
        its own Provider id and current credential version. The platform administrator token is also
        accepted for recovery and controlled operations.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [offers]
              properties:
                offers:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/OfferInput"
      responses:
        "201":
          description: Offers imported.
          content:
            application/json:
              schema:
                type: object
                required: [providerId, imported]
                properties:
                  providerId:
                    type: string
                  imported:
                    type: integer
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/provider-events:
    post:
      tags: [Provider outcomes]
      operationId: recordProviderOutcomeEvent
      description: |
        Sign the exact UTF-8 JSON body with HMAC-SHA256 using this Provider's current
        `webhookSigningSecret`, then send the lowercase hexadecimal digest in
        `X-AAB-Signature: sha256=<digest>`. `providerId` is part of the signed body. The Provider id
        must own the attribution token. Events are rejected until the consumer has explicitly
        confirmed the handoff.
      parameters:
        - name: X-AAB-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^sha256=[a-f0-9]{64}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderEvent"
      responses:
        "200":
          description: Event accepted or recognized as an idempotent duplicate for this Provider.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicate, outcomeId]
                properties:
                  accepted:
                    const: true
                  duplicate:
                    type: boolean
                  outcomeId:
                    type: string
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    ProviderAdminBearer:
      type: http
      scheme: bearer
      description: Platform-only PROVIDER_ADMIN_TOKEN. Never share this with a Provider.
    ProviderBearer:
      type: http
      scheme: bearer
      description: Provider-scoped `apiToken` returned during provisioning or credential rotation.
  parameters:
    OutcomeId:
      name: outcomeId
      in: path
      required: true
      schema:
        type: string
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9._-]*$"
  responses:
    Error:
      description: Structured API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    SearchResult:
      type: object
      required: [id, title, url, displayUrl, snippet, sourceType]
      properties:
        id:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        displayUrl:
          type: string
        snippet:
          type: string
        sourceType:
          const: web
        age:
          type: [string, "null"]
    Constraints:
      type: object
      required: [budget, useCase, delivery, returns]
      properties:
        budget:
          type: [number, "null"]
        useCase:
          type: string
        delivery:
          type: string
        returns:
          type: string
    RecommendationPolicy:
      type: object
      additionalProperties: false
      required:
        - commissionUsedForRanking
        - bidsUsedForRanking
        - expectedRevenueUsedForRanking
      properties:
        commissionUsedForRanking:
          const: false
        bidsUsedForRanking:
          const: false
        expectedRevenueUsedForRanking:
          const: false
    ProviderInput:
      type: object
      additionalProperties: false
      required: [id, name, domain]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        name:
          type: string
          minLength: 1
          maxLength: 200
        domain:
          type: string
          description: Public hostname only, without a scheme, path, port, or credentials.
        active:
          type: boolean
          default: true
    ProviderCredentials:
      type: object
      additionalProperties: false
      required: [credentialVersion, apiToken, webhookSigningSecret]
      properties:
        credentialVersion:
          type: integer
          minimum: 1
        apiToken:
          type: string
          writeOnly: true
          description: Bearer token scoped to this Provider's Offer import endpoint.
        webhookSigningSecret:
          type: string
          writeOnly: true
          description: HMAC secret scoped to this Provider's outcome callbacks.
    ProviderProvisioning:
      type: object
      required: [id, name, domain, active, credentials]
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
        active:
          type: boolean
        credentials:
          $ref: "#/components/schemas/ProviderCredentials"
    OfferInput:
      type: object
      additionalProperties: false
      required:
        - id
        - category
        - title
        - price
        - currency
        - availability
        - deliveryText
        - returnsText
        - warrantyText
        - prepareUrl
        - sourceUrl
        - retrievedAt
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        category:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 2000
        price:
          type: number
          minimum: 0
          maximum: 1000000
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        availability:
          type: string
          maxLength: 80
        deliveryText:
          type: string
          maxLength: 300
        returnsText:
          type: string
          maxLength: 300
        warrantyText:
          type: string
          maxLength: 300
        prepareUrl:
          type: string
          format: uri
          description: HTTPS URL on the Provider hostname or one of its subdomains.
        sourceUrl:
          type: string
          format: uri
          description: HTTPS URL on the Provider hostname or one of its subdomains.
        evidence:
          type: object
          additionalProperties: true
        retrievedAt:
          type: string
          format: date-time
        active:
          type: boolean
          default: true
    OfferView:
      type: object
      required:
        - id
        - providerId
        - providerName
        - providerDomain
        - category
        - title
        - description
        - price
        - currency
        - availability
        - delivery
        - returns
        - warranty
        - sourceUrl
        - retrievedAt
        - strengths
        - tradeoffs
        - evidence
        - recommendationIndependent
      properties:
        id:
          type: string
        providerId:
          type: string
        providerName:
          type: string
        providerDomain:
          type: string
        category:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
        currency:
          type: string
        availability:
          type: string
        delivery:
          type: string
        returns:
          type: string
        warranty:
          type: string
        sourceUrl:
          type: string
          format: uri
        retrievedAt:
          type: string
          format: date-time
        strengths:
          type: array
          items:
            type: string
        tradeoffs:
          type: array
          items:
            type: string
        evidence:
          type: object
          additionalProperties: true
        recommendationIndependent:
          const: true
    PreparedOutcome:
      type: object
      required:
        - outcomeId
        - taskId
        - status
        - offer
        - attributionToken
        - handoffUrl
        - reversalDeadline
        - userConfirmationRequired
      properties:
        outcomeId:
          type: string
        taskId:
          type: string
        status:
          const: prepared
        offer:
          $ref: "#/components/schemas/OfferView"
        attributionToken:
          type: string
        handoffUrl:
          type: string
          format: uri
        reversalDeadline:
          type: string
          format: date-time
        userConfirmationRequired:
          const: true
    Outcome:
      type: object
      required:
        - id
        - taskId
        - offerId
        - offerTitle
        - providerId
        - providerName
        - providerDomain
        - attributionToken
        - status
        - amount
        - currency
        - userConfirmed
        - handoffUrl
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        taskId:
          type: string
        offerId:
          type: string
        offerTitle:
          type: string
        providerId:
          type: string
        providerName:
          type: string
        providerDomain:
          type: string
        attributionToken:
          type: string
        status:
          $ref: "#/components/schemas/OutcomeStatus"
        amount:
          type: number
        currency:
          type: string
        userConfirmed:
          type: boolean
        handoffUrl:
          type: string
          format: uri
        completionEvidence:
          type: [string, "null"]
        reversalDeadline:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OutcomeStatus:
      type: string
      enum: [prepared, confirmed, accepted, completed, cancelled, refunded, disputed]
    ProviderEvent:
      type: object
      additionalProperties: false
      required: [providerId, eventId, attributionToken, status, occurredAt]
      properties:
        providerId:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]*$"
        eventId:
          type: string
          minLength: 1
          maxLength: 200
        attributionToken:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [accepted, completed, cancelled, refunded, disputed]
        occurredAt:
          type: string
          format: date-time
        evidence:
          type: object
          additionalProperties: true
    OutcomeEvent:
      type: object
      required: [id, providerEventId, status, occurredAt, receivedAt, evidence]
      properties:
        id:
          type: string
        providerEventId:
          type: string
        status:
          type: string
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        evidence:
          type: object
          additionalProperties: true
