name: Browser extension

on:
  pull_request:
    paths:
      - "apps/extension/**"
      - "apps/web/src/lib/browserContext.ts"
      - "apps/web/src/lib/browserContext.test.ts"
      - "apps/web/src/pages/SearchPage.tsx"
      - "apps/web/src/pages/ComparePage.tsx"
      - ".github/workflows/extension.yml"
  push:
    branches: [main]
    paths:
      - "apps/extension/**"
      - "apps/web/src/lib/browserContext.ts"
      - "apps/web/src/lib/browserContext.test.ts"
      - "apps/web/src/pages/SearchPage.tsx"
      - "apps/web/src/pages/ComparePage.tsx"
      - ".github/workflows/extension.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Validate extension JavaScript
        run: |
          node --check apps/extension/service-worker.js
          node --check apps/extension/sidepanel.js
          node --check apps/extension/lib/context.mjs
      - name: Validate privacy-bounded Manifest V3
        run: node apps/extension/scripts/validate-manifest.mjs
      - name: Run extension tests
        run: node --test apps/extension/tests/*.test.mjs
      - name: Package installable extension
        run: |
          mkdir -p dist
          cd apps/extension
          zip -r ../../dist/ai-action-browser-extension.zip \
            manifest.json \
            service-worker.js \
            sidepanel.html \
            sidepanel.css \
            sidepanel.js \
            lib
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-action-browser-extension
          path: dist/ai-action-browser-extension.zip
          if-no-files-found: error
          retention-days: 14
