name: Production API

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "docs/production-validation.md"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "docs/production-validation.md"
      - ".github/workflows/api.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply local D1 migrations
        run: npm run db:migrate:local
      - name: Validate OpenAPI YAML
        run: ruby -e 'require "yaml"; document = YAML.load_file("openapi.yaml"); abort "not OpenAPI 3.1" unless document["openapi"] == "3.1.0"; puts "OpenAPI YAML syntax OK"'
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Security and contract tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
