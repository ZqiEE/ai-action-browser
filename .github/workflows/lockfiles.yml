name: Generate dependency locks

on:
  pull_request:
    paths:
      - ".github/workflows/lockfiles.yml"
      - "apps/api/package.json"
      - "apps/web/package.json"

permissions:
  contents: write

concurrency:
  group: dependency-locks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Generate API lock
        run: npm install --package-lock-only --ignore-scripts --prefix apps/api
      - name: Generate Web lock
        run: npm install --package-lock-only --ignore-scripts --prefix apps/web
      - name: Commit locks to the pull request branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/package-lock.json apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency locks are already current."
            exit 0
          fi
          git commit -m "Lock API and Web dependencies"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
