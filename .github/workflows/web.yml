name: Web application

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Upload generated package lock
        uses: actions/upload-artifact@v4
        with:
          name: web-package-lock
          path: apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Production-flow contract test
        run: npm run test:e2e
